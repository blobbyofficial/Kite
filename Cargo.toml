[package]
name = "kite"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "A fast video editor"
default-run = "kite"
build = "build.rs"

[[bin]]
name = "kite"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
egui = "0.33"
# eframe with default-features off leaves wgpu with no graphics backend compiled in at all, and
# the application then aborts on startup with "No wgpu backend feature ... was enabled". Naming
# wgpu directly turns the backends on through feature unification. gles is the fallback for
# machines whose Vulkan or D3D12 drivers are broken or absent, which is squarely our target.
wgpu = { version = "27", default-features = false, features = ["vulkan", "dx12", "gles", "metal"] }
# Note: Cargo.lock matters here. gpu-allocator accepts windows ">=0.53,<=0.58" and will happily
# unify on the 0.54 that cpal pulls in, while wgpu-hal always wants 0.58 — a legal resolution that
# fails to compile only once dx12 is built, so it is invisible on Linux. The lock pins both to
# 0.58. If a future `cargo update` regresses it, the Windows build fails with "multiple different
# versions of crate `windows`".
rfd = "0.15"
# Titles are rasterised once, by us, for both the preview and the export. ab_glyph is already
# in the tree underneath egui, so this costs nothing new.
ab_glyph = "0.2"
# Blocking on device and adapter requests during startup and export; wgpu is async-first.
pollster = "0.4"
cpal = "0.16"
zune-jpeg = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
anyhow = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
dirs = "6"
rayon = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
